name: Model Component Generator and Updater
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  generate-and-update-components:
    if: github.repository == 'meshery/meshery' || github.repository == 'ishwar170695/meshery'
    name: Generate and Update Components
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: nonexistent.mod

      - name: Pull changes from remote
        id: pull-initial
        run: |
          set -o pipefail
          git pull origin master 2>&1 | tee "$RUNNER_TEMP/pull-initial.log"

      - name: Build mesheryctl
        id: build-mesheryctl
        run: |
          set -o pipefail
          cd mesheryctl
          make 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Generate Models and Components
        id: generate-models
        env:
          CRED: ${{ secrets.INTEGRATION_SPREADSHEET_CRED }}
        run: |
          set -o pipefail
          cd mesheryctl
          ./mesheryctl registry generate \
            --spreadsheet-id "1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw" \
            --spreadsheet-cred "$CRED" \
            2>&1 | tee "$RUNNER_TEMP/generate.log"

      - name: Upload artifacts
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generate-logs
          path: ~/.meshery/logs/

      - name: Check registry-generate-error file
        id: check-registry-generate-error
        run: |
          if [ -s ~/.meshery/logs/registry/registry-errors.log ]; then
            echo "registry-generate-error=true" >> $GITHUB_ENV
          else
            echo "registry-generate-error=false" >> $GITHUB_ENV
          fi

      - name: Run Model Updater
        id: update-models
        env:
          CRED: ${{ secrets.INTEGRATION_SPREADSHEET_CRED }}
        run: |
          set -o pipefail
          cd mesheryctl
          ./mesheryctl registry update \
            -i ../models \
            --spreadsheet-id "1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw" \
            --spreadsheet-cred "$CRED" \
            2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Pull changes from remote
        id: pull-pre-commit
        run: |
          set -o pipefail
          git pull origin master 2>&1 | tee "$RUNNER_TEMP/pull-pre-commit.log"

      - name: Commit changes
        id: commit-changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: l5io
          commit_user_email: ci@meshery.io
          commit_options: "--signoff"
          commit_message: "Models generated and updated"
          branch: master

      - name: Classify failure
        if: failure()
        id: classify-failure
        run: |
          ATTACHMENT=""
          DETAIL=""

          extract_detail() {
            local log_path="$1"
            if [ -f "$log_path" ] && [ -s "$log_path" ]; then
              sed 's/\x1b\[[0-9;]*m//g' "$log_path" \
                | grep -a -m1 '^Error: ' \
                | sed 's/^Error: //' \
                | cut -c1-200 \
                | tr -d '\r\n' || true
            fi
          }

          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then
            REASON="Check out code failed"
            DETAIL="The repository checkout step failed. Check the workflow run for details."

          elif [ "${{ steps.setup-go.outcome }}" = "failure" ]; then
            REASON="Setup Go failed"
            DETAIL="The Go setup step failed. Check the workflow run for details."

          elif [ "${{ steps.pull-initial.outcome }}" = "failure" ]; then
            REASON="Initial git pull failed"
            LOG="$RUNNER_TEMP/pull-initial.log"
            [ -f "$LOG" ] && ATTACHMENT="$LOG"
            DETAIL=$(tail -n 5 "$LOG" 2>/dev/null | tr -d '\r' | paste -sd ' ' - || true)

          elif [ "${{ steps.build-mesheryctl.outcome }}" = "failure" ]; then
            REASON="mesheryctl build failed"
            LOG="$RUNNER_TEMP/build.log"
            [ -f "$LOG" ] && ATTACHMENT="$LOG"
            DETAIL=$(tail -n 5 "$LOG" 2>/dev/null | tr -d '\r' | paste -sd ' ' - || true)

          elif [ "${{ steps.generate-models.outcome }}" = "failure" ]; then
            LOG="$RUNNER_TEMP/generate.log"
            [ -f "$LOG" ] && ATTACHMENT="$LOG"
            DETAIL=$(extract_detail "$LOG")

            if [ ! -s "$LOG" ]; then
              REASON="Model generation failed before output"
            elif grep -qa "Invalid JWT Token" "$LOG"; then
              REASON="Spreadsheet credential rejected"
            elif grep -qa "error parsing relationships" "$LOG"; then
              REASON="Relationship data could not be parsed"
            elif grep -qa "error parsing" "$LOG"; then
              REASON="Spreadsheet tab could not be read"
            elif grep -qa "error updating registry" "$LOG"; then
              REASON="Spreadsheet could not be opened"
            elif grep -qa "isn't specified" "$LOG" || grep -qa "is required" "$LOG"; then
              REASON="Invalid command arguments"
            else
              REASON="Model generation failed"
            fi

          elif [ "${{ steps.upload-artifacts.outcome }}" = "failure" ]; then
            REASON="Upload artifacts failed"
            DETAIL="The artifact upload step failed. Check the workflow run for details."

          elif [ "${{ steps.check-registry-generate-error.outcome }}" = "failure" ]; then
            REASON="Registry error check failed"
            DETAIL="The registry-generate-error check step failed. Check the workflow run for details."

          elif [ "${{ steps.update-models.outcome }}" = "failure" ]; then
            REASON="Model Updater failed"
            LOG="$RUNNER_TEMP/update.log"
            [ -f "$LOG" ] && ATTACHMENT="$LOG"
            DETAIL=$(extract_detail "$LOG")

          elif [ "${{ steps.pull-pre-commit.outcome }}" = "failure" ]; then
            REASON="Git pull before commit failed"
            LOG="$RUNNER_TEMP/pull-pre-commit.log"
            [ -f "$LOG" ] && ATTACHMENT="$LOG"
            DETAIL=$(tail -n 5 "$LOG" 2>/dev/null | tr -d '\r' | paste -sd ' ' - || true)

          elif [ "${{ steps.commit-changes.outcome }}" = "failure" ]; then
            REASON="Git auto-commit failed"
            DETAIL="git-auto-commit-action encountered an error while pushing changes to master."

          else
            REASON="Workflow failure"
            DETAIL="An unexpected failure occurred during workflow execution."
          fi

          [ -n "$DETAIL" ] || DETAIL="No specific error message was captured. Check workflow run logs."

          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"
          echo "attachment=$ATTACHMENT" >> "$GITHUB_OUTPUT"
          echo "### $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "$DETAIL" >> "$GITHUB_STEP_SUMMARY"

      - name: Send Email on Workflow Failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.classify-failure.outputs.reason }} (run #${{ github.run_number }})"
          from: |
            "Model Generator and Updater" <no-reply@meshery.io>
          to: developers@meshery.io
          body: |
            ${{ steps.classify-failure.outputs.detail }}

            Trigger : ${{ github.event_name }}
            Run     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          attachments: ${{ steps.classify-failure.outputs.attachment }}

      - name: Send Email on Registry Generate Error
        if: env.registry-generate-error == 'false' #Turn it back to true when we are good with all the errors.
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Model Generator Error Log
          from: |
            "Model Generator" <no-reply@meshery.io>
          to: developers@meshery.io
          body: |
               The Model Generator workflow (https://github.com/meshery/meshery/actions/workflows/model-generator.yml) encountered one or more errors. Refer to the attached error log for details or review the results of the failed workflow - https://github.com/meshery/meshery/actions/runs/${{ github.run_id }}.

               Learn more about the Meshery Registry - https://docs.meshery.io/concepts/logical/registry.
          attachments: ~/.meshery/logs/registry/registry-errors.log
